[workspace]
resolver = "3"
members = [
    "crates/arm-lab",
    "crates/arm-lab-demo",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Dylan-Gallagher/arm-lab"
publish = false

[workspace.lints.rust]
unsafe-code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
nalgebra = "0.35"
mujoco-rs = { version = "5", features = ["auto-download-mujoco"] }
